<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job & Schedule Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; margin-top: 0; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="date"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .btn { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { background: #0056b3; }
        .btn-green { background: #28a745; width: auto; }
        
        /* Kahon para sa mga Worker Checkboxes */
        .workers-box {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            background: #fafafa;
        }
        .worker-checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .worker-checkbox-item input {
            margin-right: 8px;
            transform: scale(1.1);
        }

        /* Mga Kulay para sa Buttons */
        .link-btn { text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; color: white; display: inline-block; border: none; cursor: pointer; font-weight: bold; }
        .map-btn { background: #ea4335; }       /* Google Maps */
        .cal-btn { background: #4285f4; }       /* Google Calendar */
        .edit-btn { background: #007bff; }      /* Edit - Blue */
        .delete-btn { background: #dc3545; }    /* Delete - Red */
        .finished-btn { background: #28a745; }  /* Finished - Green */

        .job-card { background: #f9f9f9; border-left: 5px solid #007bff; padding: 15px; margin-top: 15px; border-radius: 4px; }
        .job-card.is-finished { border-left-color: #28a745; background: #e8f5e9; opacity: 0.85; }
        .job-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        
        #suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            max-height: 150px;
            overflow-y: auto;
            z-index: 1000;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #f1f1f1;
            font-size: 14px;
        }
        .suggestion-item:hover {
            background: #e9ecef;
        }
    </style>
</head>
<body onload="initApp()">

<div class="container">
    <h2 id="formTitle">📅 Magdagdag ng Schedule</h2>
    
    <input type="hidden" id="editIndex" value="-1">

    <div class="form-group">
        <label>Pangalan / Uri ng Trabaho:</label>
        <input type="text" id="jobTitle" placeholder="Hal. Installation ng GIB & Plastering">
    </div>

    <div class="form-group">
        <label>Address ng Lokasyon:</label>
        <input type="text" id="jobAddress" placeholder="Mag-type ng address..." onkeyup="searchAddress(this.value)" autocomplete="off">
        <div id="suggestions"></div>
    </div>

    <!-- Multi-Worker Checkboxes -->
    <div class="form-group">
        <label>Pumili ng mga Worker (Pwede marami):</label>
        <div id="workersContainer" class="workers-box">
            <!-- Dito kusang papasok ang listahan ng mga tao -->
        </div>
        <button type="button" class="btn btn-green" style="margin-top: 8px;" onclick="addNewWorkerPrompt()">+ Magdagdag ng Bagong Worker sa Listahan</button>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Petsa ng Simula:</label>
            <input type="date" id="startDate">
        </div>
        <div class="form-group">
            <label>Petsa ng Tapos:</label>
            <input type="date" id="endDate">
        </div>
    </div>

    <button class="btn" id="saveBtn" onclick="saveSchedule()">I-save ang Schedule</button>

    <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ddd;">

    <h3>📋 Listahan ng mga Trabaho</h3>
    <div id="scheduleList">
        <p style="color: #777; font-style: italic;">Wala pang naka-save na schedule.</p>
    </div>
</div>

<script>
    // Paunang listahan ng mga worker kung wala pang naka-save
    let defaultWorkers = ["Frank Nesperos", "John Doe", "Worker 3", "Worker 4", "Worker 5", "Worker 6"];

    function initApp() {
        loadWorkerCheckboxes();
        loadSchedules();
    }

    // Load worker checkboxes sa form
    function loadWorkerCheckboxes(selectedWorkers = []) {
        let workersList = JSON.parse(localStorage.getItem("systemWorkers")) || defaultWorkers;
        const container = document.getElementById("workersContainer");
        container.innerHTML = "";

        workersList.forEach(worker => {
            const isChecked = selectedWorkers.includes(worker) ? "checked" : "";
            const div = document.createElement("div");
            div.className = "worker-checkbox-item";
            div.innerHTML = `
                <label style="font-weight: normal; cursor: pointer; display: flex; align-items: center; width: 100%;">
                    <input type="checkbox" value="${worker}" ${isChecked} class="worker-chk"> ${worker}
                </label>
            `;
            container.appendChild(div);
        });
    }

    // Magdagdag ng bagong worker sa buong listahan
    function addNewWorkerPrompt() {
        const pangalan = prompt("Ilagay ang pangalan ng bagong worker:");
        if (pangalan && pangalan.trim() !== "") {
            let workersList = JSON.parse(localStorage.getItem("systemWorkers")) || defaultWorkers;
            const newName = pangalan.trim();
            
            if (!workersList.includes(newName)) {
                workersList.push(newName);
                localStorage.setItem("systemWorkers", JSON.stringify(workersList));
                
                // Kunin ang mga kasalukuyang nakatsek para hindi mawala
                let currentSelected = getSelectedWorkersFromForm();
                currentSelected.push(newName);
                
                loadWorkerCheckboxes(currentSelected);
                alert(`Naidagdag na si ${newName} sa master list ng mga worker!`);
            } else {
                alert("Nakalista na po ang pangalang iyan.");
            }
        }
    }

    function getSelectedWorkersFromForm() {
        const checkboxes = document.querySelectorAll(".worker-chk:checked");
        let selected = [];
        checkboxes.forEach(chk => selected.push(chk.value));
        return selected;
    }

    let searchTimeout;
    function searchAddress(query) {
        clearTimeout(searchTimeout);
        const suggestionsBox = document.getElementById("suggestions");

        if (query.length < 3) {
            suggestionsBox.innerHTML = "";
            return;
        }

        searchTimeout = setTimeout(() => {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    suggestionsBox.innerHTML = "";
                    data.forEach(place => {
                        const div = document.createElement("div");
                        div.className = "suggestion-item";
                        div.textContent = place.display_name;
                        div.onclick = () => {
                            document.getElementById("jobAddress").value = place.display_name;
                            suggestionsBox.innerHTML = "";
                        };
                        suggestionsBox.appendChild(div);
                    });
                })
                .catch(err => console.error("Error:", err));
        }, 300);
    }

    document.addEventListener("click", function(e) {
        if (!e.target.closest("#jobAddress")) {
            document.getElementById("suggestions").innerHTML = "";
        }
    });

    function loadSchedules() {
        const savedSchedules = JSON.parse(localStorage.getItem("jobSchedules")) || [];
        const listContainer = document.getElementById("scheduleList");

        if (savedSchedules.length === 0) {
            listContainer.innerHTML = '<p style="color: #777; font-style: italic;">Wala pang naka-save na schedule.</p>';
            return;
        }

        listContainer.innerHTML = "";
        savedSchedules.forEach((job, index) => {
            renderJobCard(job, index);
        });
    }

    function saveSchedule() {
        const title = document.getElementById("jobTitle").value;
        const address = document.getElementById("jobAddress").value;
        const workers = getSelectedWorkersFromForm();
        const start = document.getElementById("startDate").value;
        const end = document.getElementById("endDate").value;
        const editIndex = parseInt(document.getElementById("editIndex").value);

        if (!title || !address || !start || !end) {
            alert("Pakipunan po ang lahat ng kailangang detalye (Trabaho, Address, at Petsa)!");
            return;
        }

        if (workers.length === 0) {
            alert("Pumili muli kahit isang worker man lang para sa site na ito.");
            return;
        }

        let savedSchedules = JSON.parse(localStorage.getItem("jobSchedules")) || [];

        if (editIndex === -1) {
            const newJob = { title, address, workers, start, end, finished: false };
            savedSchedules.unshift(newJob);
            alert("Matagumpay na naidagdag ang schedule!");
        } else {
            savedSchedules[editIndex].title = title;
            savedSchedules[editIndex].address = address;
            savedSchedules[editIndex].workers = workers;
            savedSchedules[editIndex].start = start;
            savedSchedules[editIndex].end = end;
            
            clearForm();
            alert("Matagumpay na na-update ang schedule!");
        }

        localStorage.setItem("jobSchedules", JSON.stringify(savedSchedules));
        loadSchedules();
        clearForm();
    }

    function clearForm() {
        document.getElementById("jobTitle").value = "";
        document.getElementById("jobAddress").value = "";
        document.getElementById("startDate").value = "";
        document.getElementById("endDate").value = "";
        document.getElementById("editIndex").value = "-1";
        document.getElementById("formTitle").textContent = "📅 Magdagdag ng Schedule";
        document.getElementById("saveBtn").textContent = "I-save ang Schedule";
        loadWorkerCheckboxes([]);
    }

    function editSchedule(index) {
        let savedSchedules = JSON.parse(localStorage.getItem("jobSchedules")) || [];
        const job = savedSchedules[index];

        if (!job) return;

        document.getElementById("jobTitle").value = job.title;
        document.getElementById("jobAddress").value = job.address;
        
        // I-load ang mga worker at lagyan ng tsek kung sino ang naka-assign sa job na ito
        // Kung sakaling may lumang data na iisang worker lang, i-handle natin nang maayos
        let assignedWorkers = job.workers || (job.worker ? [job.worker] : []);
        loadWorkerCheckboxes(assignedWorkers);

        document.getElementById("startDate").value = job.start;
        document.getElementById("endDate").value = job.end;
        
        document.getElementById("editIndex").value = index;
        document.getElementById("formTitle").textContent = "✏️ I-edit ang Schedule (Update Mode)";
        document.getElementById("saveBtn").textContent = "I-update ang Schedule";
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleFinished(index) {
        let savedSchedules = JSON.parse(localStorage.getItem("jobSchedules")) || [];
        savedSchedules[index].finished = !savedSchedules[index].finished;
        localStorage.setItem("jobSchedules", JSON.stringify(savedSchedules));
        loadSchedules();
    }

    function deleteSchedule(index) {
        if (confirm("Sigurado ka bang gusto mong tanggalin ang sched na ito?")) {
            let savedSchedules = JSON.parse(localStorage.getItem("jobSchedules")) || [];
            savedSchedules.splice(index, 1);
            localStorage.setItem("jobSchedules", JSON.stringify(savedSchedules));
            loadSchedules();
        }
    }

    function renderJobCard(job, index) {
        const listContainer = document.getElementById("scheduleList");
        
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(job.address)}`;
        const startFmt = job.start.replaceAll('-', '');
        const endFmt = job.end.replaceAll('-', '');
        
        // Kunin ang listahan ng mga worker para sa calendar details
        let workersArray = job.workers || (job.worker ? [job.worker] : []);
        const workersStr = workersArray.join(", ");
        
        const calUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(job.title)}&dates=${startFmt}/${endFmt}&details=${encodeURIComponent('Mga Worker: ' + workersStr)}&location=${encodeURIComponent(job.address)}`;

        const card = document.createElement("div");
        card.className = `job-card ${job.finished ? 'is-finished' : ''}`;
        card.innerHTML = `
            <h4 style="margin: 0 0 8px 0; color: #333;">${job.title} ${job.finished ? '✅ (Finished)' : ''}</h4>
            <p style="margin: 4px 0;"><strong>Mga Worker:</strong> 👤 ${workersStr}</p>
            <p style="margin: 4px 0;"><strong>Address:</strong> 📍 <a href="${mapUrl}" target="_blank" style="color: #1a73e8; text-decoration: underline;">${job.address}</a></p>
            <p style="margin: 4px 0;"><strong>Petsa:</strong> 📅 ${job.start} hanggang ${job.end}</p>
            <div class="job-actions">
                <a href="${mapUrl}" target="_blank" class="link-btn map-btn">🗺️ Maps</a>
                <a href="${calUrl}" target="_blank" class="link-btn cal-btn">📅 Calendar</a>
                <button class="link-btn edit-btn" onclick="editSchedule(${index})">✏️ Edit</button>
                <button class="link-btn finished-btn" onclick="toggleFinished(${index})">${job.finished ? '↩️ Ulitin' : '✔️ Finished'}</button>
                <button class="link-btn delete-btn" onclick="deleteSchedule(${index})">🗑️ Delete</button>
            </div>
        `;

        listContainer.appendChild(card);
    }
</script>

</body>
</html>
